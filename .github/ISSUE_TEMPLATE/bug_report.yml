name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Addon version
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version (e.g. 12.1.5 Retail)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Lua error (BugSack / BugGrabber text)
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
