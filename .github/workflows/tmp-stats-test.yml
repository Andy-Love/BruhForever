name: tmp stats test
on:
  pull_request:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch stats "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats-data
          python3 scripts/stats.py stats-data/downloads.csv "ci-test"
          cd stats-data
          git add downloads.csv
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "ci test"
          git push origin HEAD:refs/heads/stats-test
